name: Build gfortran wheels (macOS)

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64

      - name: Install GNU compilers
        run: brew install gcc

      - name: Build wheel
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: bash scripts/topbuild_manywheel_macos.sh

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos-arm64-py${{ matrix.python-version }}
          path: dist/macos-arm64/*.whl
          if-no-files-found: error
          retention-days: 14

name: Build gfortran wheels (Linux)

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux2014
            abis: cp310 cp311 cp312 cp313
          - platform: manylinux_2_28
            abis: cp314 cp315
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        env:
          PYTHON_ABIS: ${{ matrix.abis }}
        run: |
          read -ra abis <<< "$PYTHON_ABIS"
          bash scripts/topbuild_manywheel_linux_gfortran.sh "${abis[@]}"
        shell: bash

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.platform }}
          path: dist/gfortran-${{ matrix.platform }}/*.whl
          if-no-files-found: error
          retention-days: 14
